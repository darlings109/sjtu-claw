<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJTUClaw</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;display:flex;height:100vh;background:#f5f5f5}
.sidebar{width:260px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0}
.sidebar h2{padding:18px 16px;font-size:16px;color:#333;border-bottom:1px solid #eee}
#session-list{flex:1;overflow-y:auto;padding:6px 8px}
.si{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .15s}
.si:hover{background:#f0f0f0;border-color:#ddd}
.si.active{background:#e3f2fd;border-color:#90caf9;font-weight:600}
.si .title{font-size:14px;color:#1a1a1a;padding-right:55px}
.si .meta{font-size:11px;color:#999;margin-top:3px}
.si .badge{background:#e3f2fd;color:#1976d2;border-radius:10px;padding:1px 8px;font-size:11px}
.si{position:relative}
.si .btn-group{position:absolute;top:8px;right:8px;display:none;gap:2px}
.si:hover .btn-group{display:flex}
.si .btn-group button{width:24px;height:24px;border:none;border-radius:6px;cursor:pointer;font-size:12px;line-height:24px;text-align:center;padding:0}
.si .btn-rename{background:#e8f0fe;color:#1976d2}
.si .btn-rename:hover{background:#bbdefb}
.si .btn-delete{background:#fce4ec;color:#c62828}
.si .btn-delete:hover{background:#f8bbd0}
.btn-new{display:block;margin:8px;padding:10px;background:#1976d2;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;text-align:center}
.btn-new:hover{background:#1565c0}
.main{flex:1;display:flex;flex-direction:column;background:#fff}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:75%;padding:12px 18px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1976d2;color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;border:1px solid #e0e0e0;color:#333;border-bottom-left-radius:4px}
.placeholder{text-align:center;color:#bbb;margin-top:60px;font-size:14px;line-height:2}
.input-area{display:flex;padding:16px 20px;background:#fff;border-top:1px solid #eee;gap:10px}
.input-area input{flex:1;padding:12px 18px;border:1px solid #e0e0e0;border-radius:24px;outline:none;font-size:14px}
.input-area input:focus{border-color:#1976d2}
.input-area button{padding:12px 24px;background:#1976d2;color:#fff;border:none;border-radius:24px;cursor:pointer;font-size:14px;font-weight:500}
.input-area button:disabled{background:#ccc;cursor:not-allowed}
.approval-card{background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:14px 18px;margin:12px 0;align-self:center;min-width:300px;max-width:90%}
.approval-card h4{color:#f57f17;font-size:14px;margin-bottom:8px}
.approval-card .detail{font-size:13px;color:#555;margin-bottom:10px}
.approval-card .btns{display:flex;gap:8px;justify-content:center}
.approval-card .btns button{padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.approval-card .btn-ok{background:#43a047;color:#fff}
.approval-card .btn-ok:hover{background:#388e3c}
.approval-card .btn-no{background:#e53935;color:#fff}
.approval-card .btn-no:hover{background:#c62828}
</style>
</head>
<body>
<div class=sidebar>
<h2>SJTUClaw</h2>
<button class=btn-new id=btnNew>+ New Session</button>
<div id=session-list></div>
</div>
<div class=main>
<div id=messages><div class=placeholder>Select a session to start chatting</div></div>
<div class=input-area>
<input id=input placeholder="Type a message..." disabled>
<button id=btnSend disabled>Send</button>
</div>
</div>
<script>
var cur = null;

function api(path, opts) {
  return fetch(path, opts).then(function(r){
    return r.json().then(function(d){
      if (!r.ok) throw new Error(d.error || 'Error');
      return d;
    });
  });
}

function load() {
  api('/api/sessions').then(function(ss){
    var h = '';
    for (var i = 0; i < ss.length; i++) {
      var s = ss[i];
      var a = (s.session_id === cur) ? ' active' : '';
      var t = s.updated_at ? s.updated_at.slice(5,16) : '';
      h += '<div class="si' + a + '" data-id="' + s.session_id + '">' +
        '<div class="title">' + esc(s.title) + '</div>' +
        '<div class="meta">' + t + ' <span class="badge">' + s.message_count + ' msgs</span></div>' +
        '<div class="btn-group">' +
        '<button class="btn-rename">✎</button>' +
        '<button class="btn-delete">✖</button>' +
        '</div>' +
        '</div>';
    }
    var el = document.getElementById('session-list');
    el.innerHTML = h;
    // click on each session
    var items = el.querySelectorAll('.si');
    for (var j = 0; j < items.length; j++) {
      var si = items[j];
      si.addEventListener('click', function(e) {
        if (e.target.closest('.btn-group')) return;
        switchTo(this.getAttribute('data-id'));
      });
      // Rename button
      var rBtn = si.querySelector('.btn-rename');
      if (rBtn) {
        rBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          doRename(this.closest('.si').getAttribute('data-id'));
        });
      }
      // Delete button
      var dBtn = si.querySelector('.btn-delete');
      if (dBtn) {
        dBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          doDelete(this.closest('.si').getAttribute('data-id'));
        });
      }
    }
  }).catch(function(){});
}

function switchTo(id) {
  cur = id;
  document.getElementById('input').disabled = false;
  document.getElementById('btnSend').disabled = false;
  document.getElementById('input').focus();
  var el = document.getElementById('messages');
  el.innerHTML = '<div style="text-align:center;color:#999;margin:40px">Loading...</div>';
  api('/api/sessions/' + id).then(function(s){
    var h = '';
    for (var i = 0; i < s.messages.length; i++) {
      var m = s.messages[i];
      h += '<div class="msg ' + m.role + '">' + esc(m.content) + '</div>';
    }
    el.innerHTML = h || '<div class="placeholder">No messages yet</div>';
    el.scrollTop = el.scrollHeight;
    load();
  }).catch(function(){});
}

function newSession() {
  api('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).then(function(s){
    switchTo(s.session_id);
  }).catch(function(){});
}

function doRename(id) {
  var name = prompt('Rename ' + id + ':');
  if (name && name.trim()) {
    api('/api/sessions/' + id + '/rename', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:name.trim()})}).then(function(){
      load();
      if (cur === id) switchTo(id);
    }).catch(function(){});
  }
}

function doDelete(id) {
  if (!confirm('Delete session ' + id + '?')) return;
  api('/api/sessions/' + id, {method:'DELETE'}).then(function(){
    if (cur === id) {
      cur = null;
      document.getElementById('messages').innerHTML = '<div class="placeholder">Select a session</div>';
      document.getElementById('input').disabled = true;
      document.getElementById('btnSend').disabled = true;
    }
    load();
  }).catch(function(){});
}

function send() {
  var i = document.getElementById('input');
  var t = i.value.trim();
  if (!t || !cur) return;
  i.value = '';
  var el = document.getElementById('messages');
  var ph = el.querySelector('.placeholder');
  if (ph) ph.remove();
  el.innerHTML += '<div class="msg user">' + esc(t) + '</div>';
  api('/api/sessions/' + cur + '/messages', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:t})}).then(function(r){
    el.innerHTML += '<div class="msg assistant">' + esc(r.reply) + '</div>';
    el.scrollTop = el.scrollHeight;
    load();
  }).catch(function(e){
    el.innerHTML += '<div class="msg assistant" style="color:#d32f2f">[Error] ' + esc(e.message) + '</div>';
  });
}


// Approval polling
var approvalTimer = null;

function startApprovalPolling() {
  if (approvalTimer) clearInterval(approvalTimer);
  approvalTimer = setInterval(function() {
    fetch('/api/approvals').then(function(r){return r.json()}).then(function(data){
      if (data.length > 0) {
        var el = document.getElementById('messages');
        for (var i = 0; i < data.length; i++) {
          var a = data[i];
          // Check if this approval is already shown
          if (document.getElementById('app-card-' + a.approval_id)) continue;
          var card = document.createElement('div');
          card.id = 'app-card-' + a.approval_id;
          card.className = 'approval-card';
          card.innerHTML = '<h4>✅ Approval Required</h4>' +
            '<div class="detail"><b>Tool:</b> ' + esc(a.tool) + '<br>' +
            '<b>Args:</b> ' + esc(JSON.stringify(a.args)) + '</div>' +
            '<div class="btns">' +
            '<button class="btn-ok" onclick="doApprove('' + a.approval_id + '')">✅ Approve</button>' +
            '<button class="btn-no" onclick="doReject('' + a.approval_id + '')">❌ Reject</button>' +
            '</div>';
          el.appendChild(card);
          el.scrollTop = el.scrollHeight;
        }
      }
    }).catch(function(){});
  }, 2000);
}

function doApprove(id) {
  fetch('/api/approvals/' + id + '/approve', {method:'POST'}).then(function(){
    var card = document.getElementById('app-card-' + id);
    if (card) card.innerHTML = '<div style="color:#43a047;font-weight:500;text-align:center">✅ Approved</div>';
    // The next user message will trigger the actual tool execution
  }).catch(function(){});
}

function doReject(id) {
  fetch('/api/approvals/' + id + '/reject', {method:'POST'}).then(function(){
    var card = document.getElementById('app-card-' + id);
    if (card) card.innerHTML = '<div style="color:#e53935;font-weight:500;text-align:center">❌ Rejected</div>';
  }).catch(function(){});
}

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnNew').addEventListener('click', newSession);
  document.getElementById('btnSend').addEventListener('click', send);
  document.getElementById('input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') send();
  });
  startApprovalPolling();
  load();
});
</script>
</body>
</html>
